[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "c2mips"
version = "0.1.0"
description = "MiniC (C subset) to MIPS32 assembly compiler for SPIM/MARS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []  # NFR-7: runtime uses the Python stdlib only

[project.scripts]
c2mips = "c2mips.__main__:cli"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.setuptools]
packages = ["c2mips"]

[tool.setuptools.package-data]
c2mips = ["py.typed", "runtime/*.s"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "spim: needs the spim simulator (skipped when spim is not found)",
    "random: random differential tests (M6)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
