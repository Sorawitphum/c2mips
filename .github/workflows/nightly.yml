name: nightly
on:
  schedule: [{ cron: "0 19 * * *" }]  # 02:00 Asia/Bangkok
  workflow_dispatch:
jobs:
  random-10k:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y spim gcc
      - run: pip install -e ".[dev]"
      # Spec 9.4: 10k random programs; the seeds start at today's date (YYYYMMDD * 10000)
      - run: pytest -q -m random --random-count 10000 --random-seed $(( $(date +%Y%m%d) * 10000 ))
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: random-failures, path: tests/random/failures/, if-no-files-found: ignore }

  mars:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - run: pip install -e ".[dev]"
      # Spec appendix D + S14: the MARS 4.5.1 release jar, pinned by checksum
      - run: |
          curl -fsSL -o Mars4_5.jar https://github.com/dpetersanderson/MARS/releases/download/v.4.5.1/Mars4_5.jar
          echo "ac340b676ba2b62246b9df77e62f81ad4447bcfd329ab539716bcd09950b7096  Mars4_5.jar" | sha256sum -c
      - run: pytest -q -m mars
        env: { MARS_JAR: "${{ github.workspace }}/Mars4_5.jar" }
